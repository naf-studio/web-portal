<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NAF Studio - Community Portal</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>

  <body>
    <div class="container">
      <div id="taskbar" class="taskbar">
        <div>
          <img class="logo" src="assets/images/server-icon.png" alt="Server Icon" />
        </div>
        <a></a>
        <button class="nav-btn" onclick="showContent(1)">Minecraft</button>
        <button class="nav-btn" onclick="showContent(2)">Discord</button>
        <button class="nav-btn" onclick="showContent(3)">About</button>
        <button class="nav-btn" onclick="showContent(4)">Links</button>
        <button
          id="toggle-taskbar-btn"
          class="toggle-btn hide-btn"
          onclick="toggleTaskbar()"
          aria-label="Toggle Navigation"
        >
          <img src="assets/images/left-button.png" alt="Collapse Menu" style="height: 5dvh" />
        </button>
      </div>

      <div class="content">
        <div id="content1" class="content-item">
          <div class="content1-ip1">
            <button class="copy-button" onclick="copyText('naf.com')" aria-label="Copy Server IP">
              <img src="assets/images/copy-button.png" class="coppy-button" alt="Copy Address" />
            </button>
          </div>
        </div>
        <div id="content2" class="content-item" style="display: none">Discord Community</div>
        <div id="content3" class="content-item" style="display: none">About NAF Studio</div>
        <div id="content4" class="content-item" style="display: none">Community Resources</div>
      </div>

      <button
        id="show-taskbar-btn"
        class="show-btn"
        onclick="toggleTaskbar()"
        style="display: none"
        aria-label="Expand Navigation"
      >
        <img class="show-btn" src="assets/images/right-button.png" alt="Expand Menu" />
      </button>
    </div>

    <script src="assets/js/scripts.js"></script>
  </body>
</html>
